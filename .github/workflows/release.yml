name: Release

# Pushing a version tag (for example v1.1.0), or running this workflow
# manually with a version, builds the Windows runtime, runs every test suite,
# packages the prebuilt ZIP, and publishes a GitHub release whose notes come
# from docs/releases/<version>.md. A manual run creates the tag on the
# workflow's commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release, for example v1.1.0"
        required: true

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -v

      - name: Configure C++
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++
        run: cmake --build cpp/build --config Release

      - name: Run C++ tests
        run: .\cpp\build\Release\yahtzee_core_tests.exe

      - name: Package release ZIP
        run: python scripts/build_windows_release.py --version ${{ env.VERSION }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ env.VERSION }}
          dist/aleatrix-solver-${{ env.VERSION }}-windows-x64.zip
          --title "Aleatrix Solver ${{ env.VERSION }}"
          --notes-file docs/releases/${{ env.VERSION }}.md
          --target ${{ github.sha }}
