name: Release

# Pushing a version tag (for example v1.1.0) builds the Windows runtime,
# runs every test suite, packages the prebuilt ZIP, and publishes a GitHub
# release whose notes come from docs/releases/<tag>.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -v

      - name: Configure C++
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++
        run: cmake --build cpp/build --config Release

      - name: Run C++ tests
        run: .\cpp\build\Release\yahtzee_core_tests.exe

      - name: Package release ZIP
        run: python scripts/build_windows_release.py --version ${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/aleatrix-solver-${{ github.ref_name }}-windows-x64.zip
          --title "Aleatrix Solver ${{ github.ref_name }}"
          --notes-file docs/releases/${{ github.ref_name }}.md
          --verify-tag
